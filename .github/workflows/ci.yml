name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NMC-SCS-LAUNCHER.sln

      - name: Build
        run: dotnet build NMC-SCS-LAUNCHER.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NMC-SCS-LAUNCHER.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish WPF app
        run: dotnet publish src/NmcScsLauncher.App/NmcScsLauncher.App.csproj --configuration Release --no-restore --output artifacts/publish

      - name: Publish updater
        run: dotnet publish src/NmcScsLauncher.Updater/NmcScsLauncher.Updater.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --no-restore --output artifacts/updater

      - name: Bundle updater with launcher
        shell: pwsh
        run: |
          $updater = "artifacts/updater/NmcScsLauncher.Updater.exe"
          if (-not (Test-Path $updater)) { throw "Updater executable was not published." }
          Copy-Item $updater "artifacts/publish/NmcScsLauncher.Updater.exe" -Force

      - name: Create LicenseHub release bundle
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Project version could not be resolved." }

          $releaseDir = "artifacts/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $zipName = "NMC-SCS-LAUNCHER-$version-win-x64.zip"
          $zipPath = Join-Path $releaseDir $zipName

          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path $zipPath)) { throw "LicenseHub release ZIP was not created." }

          $sha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid SHA-256 result." }
          Set-Content -Path "$zipPath.sha256" -Value "$sha256  $zipName" -Encoding ascii -NoNewline

          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            if ($names -notcontains "NmcScsLauncher.App.exe") { throw "Release ZIP is missing NmcScsLauncher.App.exe at archive root." }
            if ($names -notcontains "NmcScsLauncher.Updater.exe") { throw "Release ZIP is missing NmcScsLauncher.Updater.exe at archive root." }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "LicenseHub release bundle: $zipPath"
          Write-Host "SHA-256: $sha256"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMC-SCS-LAUNCHER-win
          path: artifacts/publish
          if-no-files-found: error

      - name: Upload LicenseHub release bundle
        uses: actions/upload-artifact@v4
        with:
          name: NMC-SCS-LAUNCHER-licensehub-release
          path: artifacts/release
          if-no-files-found: error
